<style>
:root{
  --ink:#26335F; --muted:#66759B; --on-ink:#FFFFFF;
  --surface:rgba(255,255,255,.80); --solid:#FFFFFF; --line:rgba(38,51,95,.13);
  --sun:#FFD166; --sun-ink:#5A3F00; --mint:#4FD1A5; --lav:#9D8CFF; --coral:#FF7E8F; --sky:#4DB3FF;
  --danger:#E5484D; --ok:#17A57B; --warn:#F59E0B;
  --shadow:0 14px 30px -16px rgba(38,51,95,.45);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root{
    --ink:#EAF0FF; --muted:#A3AED6; --on-ink:#151B48;
    --surface:rgba(30,37,92,.74); --solid:#222A66; --line:rgba(234,240,255,.15);
    --sun-ink:#3A2900; --danger:#FF7378; --ok:#3EDDB0;
    --shadow:0 14px 30px -16px rgba(0,0,0,.75);
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;color:var(--ink);font-family:'Nunito',-apple-system,system-ui,sans-serif;font-size:16px;line-height:1.4}
html{background:#CFE9FF}
@media (prefers-color-scheme: dark){html{background:#12174A}}
body{min-height:100vh;padding-bottom:130px}
h1,h2,h3,.fr{font-family:'Fredoka','Nunito',system-ui,sans-serif;margin:0}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
input,textarea{font:inherit;color:var(--ink)}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.wrap{max-width:520px;margin:0 auto;padding:14px 16px}

/* ===== background ===== */
.bg{position:fixed;inset:0;z-index:-1;overflow:hidden}
.bg svg{position:absolute;inset:0;width:100%;height:100%}
.bg .night{display:none}
@media (prefers-color-scheme: dark){.bg .day{display:none}.bg .night{display:block}}
.cl{animation:drift 60s linear infinite alternate}
.cl2{animation-duration:90s;animation-direction:alternate-reverse}
@keyframes drift{from{transform:translateX(-40px)}to{transform:translateX(60px)}}
.tw{animation:twinkle 3.5s ease-in-out infinite}
.tw:nth-child(2n){animation-delay:1.1s}.tw:nth-child(3n){animation-delay:2.2s}
@keyframes twinkle{50%{opacity:.25}}

/* ===== top ===== */
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin:6px 2px 14px}
.ttl h1{font-size:31px;line-height:1.05;font-weight:600;text-shadow:0 1px 0 rgba(255,255,255,.35)}
.ttl p{margin:5px 0 0;color:var(--muted);font-size:14px;font-weight:600}
.gear{flex:0 0 44px;height:44px;border-radius:16px;background:var(--surface);border:1px solid var(--line);font-size:19px;box-shadow:0 2px 0 var(--line);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}

.prog{display:flex;align-items:center;gap:10px;margin:0 2px 10px;font-size:13px;color:var(--muted);font-weight:800}
.pb{flex:1;height:11px;border-radius:99px;background:var(--surface);overflow:hidden;border:1px solid var(--line)}
.pb i{display:block;height:100%;background:linear-gradient(90deg,var(--sun),var(--mint));border-radius:99px}

/* day chips */
.days{display:flex;gap:8px;overflow-x:auto;margin:0 -16px 8px;padding:4px 16px 12px;scrollbar-width:none;scroll-snap-type:x proximity}
.days::-webkit-scrollbar{display:none}
.dchip{flex:0 0 54px;height:66px;border-radius:20px;background:var(--surface);border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;scroll-snap-align:center;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-shadow:0 2px 0 var(--line)}
.dchip small{font-size:11px;color:var(--muted);font-weight:800}
.dchip b{font-family:'Fredoka',sans-serif;font-size:21px;font-weight:600}
.dchip.sel{background:var(--ink);color:var(--on-ink);transform:translateY(-2px);box-shadow:0 8px 0 -4px rgba(0,0,0,.2)}
.dchip.sel small{color:var(--on-ink);opacity:.75}
.dchip.tod:not(.sel){border:2px solid var(--sun)}

/* meal cards */
.meal{position:relative;display:flex;gap:14px;width:100%;text-align:left;padding:14px 14px 14px 20px;margin-bottom:12px;border-radius:30px;background:var(--surface);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line);box-shadow:var(--shadow);overflow:hidden;color:var(--ink)}
.meal::before{content:"";position:absolute;left:0;top:0;bottom:0;width:8px;background:var(--c)}
.meal:active{transform:scale(.99)}
.mic{flex:0 0 68px;height:68px;border-radius:24px;display:grid;place-items:center;font-size:37px;background:color-mix(in srgb,var(--c) 32%,transparent)}
.mb{flex:1;min-width:0}
.mh{font-size:13px;font-weight:800}
.mh em{font-style:normal;font-weight:700;color:var(--muted);margin-left:6px;font-size:12px}
.mn{display:block;font-family:'Fredoka',sans-serif;font-weight:600;font-size:18px;line-height:1.2;margin-top:3px}
.men{display:block;font-size:13px;color:var(--muted);margin-top:1px}
.mm{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px;align-items:center}
.pill{font-size:12px;font-weight:800;padding:3px 9px;border-radius:99px;background:color-mix(in srgb,var(--ink) 9%,transparent);white-space:nowrap}
.pill.al{background:color-mix(in srgb,var(--coral) 24%,transparent)}
.pill.hit{background:var(--danger);color:#fff}
.st-habis{background:color-mix(in srgb,var(--ok) 26%,transparent)}
.st-separuh{background:color-mix(in srgb,var(--sun) 40%,transparent)}
.st-sikit{background:color-mix(in srgb,var(--warn) 30%,transparent)}
.st-tak{background:color-mix(in srgb,var(--danger) 24%,transparent)}

.tipcard{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;border-radius:24px;background:color-mix(in srgb,var(--sun) 30%,var(--surface));border:1px solid color-mix(in srgb,var(--sun) 55%,transparent);margin:6px 0 10px}
.tipcard .ti{font-size:26px}
.tipcard b{display:block;font-size:13px}
.tipcard p{margin:2px 0 0;font-size:14px}
.tipcard small{display:block;color:var(--muted);margin-top:3px;font-size:12.5px}

/* sections / buttons */
.sec{display:flex;justify-content:space-between;align-items:center;margin:22px 2px 10px}
.sec h2{font-size:22px;font-weight:600}
.btn{background:var(--ink);color:var(--on-ink);border-radius:18px;padding:13px 18px;font-weight:800;box-shadow:0 3px 0 color-mix(in srgb,var(--ink) 55%,#000)}
.btn.gold{background:var(--sun);color:var(--sun-ink);box-shadow:0 3px 0 #C99A12}
.btn.ghost{background:var(--solid);border:1.5px solid var(--line);color:var(--ink);box-shadow:0 2px 0 var(--line)}
.btn.danger{background:var(--solid);border:1.5px solid var(--danger);color:var(--danger);box-shadow:0 2px 0 color-mix(in srgb,var(--danger) 35%,transparent)}
.btn.full{width:100%}
.btn.sm{padding:8px 14px;font-size:14px;border-radius:14px}
.btn:active{transform:translateY(2px);box-shadow:none}
.card{background:var(--surface);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:28px;padding:16px;margin-bottom:12px;box-shadow:var(--shadow)}
.card h3{font-size:18px;font-weight:600;margin-bottom:6px}
.muted{color:var(--muted)}
.empty{background:var(--surface);border:2px dashed var(--line);border-radius:26px;padding:24px 18px;text-align:center;color:var(--muted)}

/* shopping */
.weeks{display:flex;gap:8px;margin:0 0 12px;overflow-x:auto;scrollbar-width:none}
.wk{flex:1 0 auto;padding:9px 14px;border-radius:16px;background:var(--surface);border:1px solid var(--line);font-weight:800;font-size:14px;white-space:nowrap}
.wk[aria-pressed="true"]{background:var(--ink);color:var(--on-ink)}
.shop h3{font-size:16px;margin:2px 0 4px}
.si{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:11px 2px;border-bottom:1px dashed var(--line)}
.si:last-child{border:0}
.ck{flex:0 0 28px;height:28px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;color:#fff;font-weight:800;font-size:15px;background:var(--solid)}
.si[aria-pressed="true"] .ck{background:var(--mint);border-color:var(--mint)}
.si[aria-pressed="true"] .sn{text-decoration:line-through;opacity:.55}
.sn{flex:1;font-weight:700}
.sn small{display:block;color:var(--muted);font-weight:600;font-size:12.5px}
.sx{font-size:12.5px;color:var(--muted);font-weight:800}

 ["Rinse the rice and add to a pot with the water and ginger.","Simmer for 20–25 minutes until the rice breaks down into porridge.","Add finely minced chicken and grated carrot; cook 8–10 minutes more until soft.","Remove the ginger, mash or lightly blend if needed, then cool slightly."],
 "Masak banyak dan bekukan dalam bekas kecil — senang untuk hari sibuk.","Cook extra and freeze in small tubs for busy days.");
R(RB,"🥞","Pancake Pisang Oat","Banana Oat Pancakes",12,"pisang:1 bj|telur:1 bj|oat:2 sb|minyak:1/2 sk",
 ["Lenyek pisang masak sehingga licin.","Campurkan telur dan oat (kisar halus jika mahu lebih lembut), gaul rata.","Panaskan kuali dengan sedikit minyak atas api kecil. Sudukan adunan kecil-kecil.","Masak 2 minit setiap sisi sehingga perang keemasan dan masak dalam. Potong kecil-kecil."],
 ["Mash the ripe banana until smooth.","Mix in the egg and oats (blend the oats finer for a softer texture).","Heat a pan with a little oil on low heat and spoon in small rounds of batter.","Cook 2 minutes per side until golden and cooked through. Cut into small pieces."],
 "Sesuai sebagai makanan jari untuk belajar menyuap sendiri.","A great finger food for self-feeding practice.");
R(RB,"🍞","Roti Bakar Telur Jari","Egg French Toast Fingers",10,"roti:1 kp|telur:1 bj|susu:2 sb|mentega:1/2 sk",
 ["Pukul telur dengan susu dalam pinggan cetek.","Celup roti sehingga kedua-dua belah basah.","Cairkan mentega di kuali, panggang roti api kecil sehingga perang dan telur masak sepenuhnya.","Potong jari-jari kecil. Sejukkan sebelum dihidang."],
 ["Whisk the egg and milk in a shallow dish.","Dip the bread so both sides are soaked.","Melt butter in a pan and cook the bread on low heat until golden and the egg is fully set.","Cut into small fingers. Cool before serving."],
 "Boleh ditambah sedikit kayu manis untuk rasa.","Add a little cinnamon for flavour.");
R(RB,"🥣","Yogurt Oat & Epal Masak","Yogurt Oat Bowl with Cooked Apple",10,"yogurt:80 g|oat:1 sb|epal:1/2 bj",
 ["Kupas epal, parut atau potong kecil, kemudian kukus atau rebus 5 minit sehingga lembut.","Lenyek epal yang telah masak.","Gaul yogurt asli (tanpa gula) bersama oat segera dan epal.","Biarkan 3 minit supaya oat menjadi lembut sebelum dihidang."],
 ["Peel the apple, grate or dice it, then steam or boil for 5 minutes until soft.","Mash the cooked apple.","Stir plain unsweetened yogurt with the instant oats and apple.","Leave for 3 minutes so the oats soften before serving."],
 "Pilih yogurt asli tanpa gula tambahan.","Choose plain yogurt with no added sugar.");
R(RB,"🍠","Lenyek Labu & Keledek","Pumpkin & Sweet Potato Mash",20,"keledek:80 g|labu:50 g|susu:50 ml|mentega:1/2 sk",
 ["Kupas dan potong dadu keledek dan labu.","Kukus 12–15 minit sehingga sangat lembut.","Lenyek bersama susu dan mentega sehingga halus atau berketul kecil.","Sejukkan sedikit dan hidang."],
 ["Peel and dice the sweet potato and pumpkin.","Steam for 12–15 minutes until very soft.","Mash with the milk and butter until smooth or slightly chunky.","Cool a little and serve."],
 "Kaya vitamin A dan serat — lembut untuk perut.","Rich in vitamin A and fibre — gentle on the tummy.");
R(RB,"🍳","Nasi Goreng Telur Bayi","Baby Egg Fried Rice",12,"nasi:1/2 cw|telur:1 bj|lobak:1 sb|bawangputih:1/2 ukm|minyak:1/2 sk",
 ["Panaskan minyak, tumis bawang putih yang dicincang halus sebentar.","Masukkan lobak parut, masak 2 minit.","Pecahkan telur, kacau sehingga masak, kemudian masukkan nasi dan gaul rata.","Masak 2–3 minit. Jangan guna kicap masin atau garam."],
 ["Heat the oil and briefly sauté the finely minced garlic.","Add the grated carrot and cook for 2 minutes.","Crack in the egg, scramble until cooked, then add the rice and mix well.","Cook for 2–3 minutes. Do not add salty soy sauce or salt."],
 "Guna nasi semalam supaya tidak melekat.","Day-old rice works best and won't clump.");
R(RB,"🍜","Sup Bihun Ayam Lembut","Soft Chicken Bihun Soup",20,"bihun:20 g|ayam:30 g|sawi:2 hlm|stok:200 ml|bawangputih:1/2 ukm",
 ["Rendam bihun dalam air suam 5 minit, kemudian potong pendek-pendek.","Didihkan stok bersama bawang putih. Masukkan ayam cincang halus, masak 5 minit.","Masukkan sawi yang dicincang halus dan bihun, masak 3–4 minit sehingga sangat lembut.","Sejukkan sedikit dan hidang dengan sudu."],
 ["Soak the bihun in warm water for 5 minutes, then cut into short pieces.","Bring the stock to a boil with the garlic. Add finely minced chicken and cook 5 minutes.","Add finely chopped choy sum and the bihun; cook 3–4 minutes until very soft.","Cool slightly and serve with a spoon."],
 "Potong bihun pendek supaya mudah ditelan.","Cut the bihun short so it is easy to swallow.");
R(RB,"🥑","Roti Alpukat Jari","Avocado Toast Fingers",5,"roti:1 kp|alpukat:1/4 bj",
 ["Lenyek alpukat masak dengan garfu sehingga berkrim.","Panggang roti sedikit sahaja supaya masih lembut.","Sapu alpukat di atas roti.","Potong jari-jari kecil dan hidang."],
 ["Mash the ripe avocado with a fork until creamy.","Toast the bread lightly so it stays soft.","Spread the avocado on the bread.","Cut into small fingers and serve."],
 "Lemak sihat untuk otak yang sedang membesar.","Healthy fats for a growing brain.");
R(RB,"🧁","Kek Kukus Pisang Oat","Steamed Banana Oat Cakes",25,"pisang:1 bj|oat:3 sb|telur:1 bj|kayumanis:cub",
 ["Lenyek pisang dan campurkan dengan telur, oat dan kayu manis.","Tuang ke dalam acuan kecil atau cawan silikon.","Kukus 12–15 minit sehingga masak (cucuk lidi, keluar bersih).","Sejukkan dan potong kecil sebelum dihidang."],
 ["Mash the banana and mix with the egg, oats and cinnamon.","Pour into small moulds or silicone cups.","Steam for 12–15 minutes until cooked (a skewer comes out clean).","Cool and cut into small pieces before serving."],
 "Boleh dibuat sekali gus dan disimpan dalam peti sejuk 2 hari.","Make a batch and keep in the fridge for 2 days.");
R(RB,"🫘","Bubur Kacang Hijau Tanpa Gula","Sugar-free Mung Bean Porridge",40,"kacanghijau:3 sb|keledek:50 g|santan:50 ml|air:300 ml",
 ["Rendam kacang hijau 2 jam atau semalaman, kemudian bilas.","Rebus kacang hijau bersama air 20–25 minit sehingga pecah dan lembut.","Masukkan keledek yang dipotong dadu kecil, masak 10 minit lagi.","Masukkan santan cair, kacau dan didihkan sebentar. Lenyek sedikit dan sejukkan."],
 ["Soak the mung beans for 2 hours or overnight, then rinse.","Boil the beans in the water for 20–25 minutes until soft and split.","Add finely diced sweet potato and cook 10 minutes more.","Stir in the thin coconut milk and bring just to a simmer. Mash lightly and cool."],
 "Tidak perlu gula — keledek sudah memaniskannya.","No sugar needed — the sweet potato sweetens it.");
R(RB,"🥚","Telur Kukus Lembut","Silky Steamed Egg",15,"telur:1 bj|stok:80 ml|daunbawang:cub",
 ["Pukul telur perlahan dengan stok (tanpa garam) supaya tidak berbuih.","Tapis ke dalam mangkuk kecil.","Tutup mangkuk dengan foil dan kukus api kecil 10–12 minit sehingga set sepenuhnya.","Taburkan daun bawang cincang halus. Sejukkan dan hidang."],
 ["Gently whisk the egg with unsalted stock so it doesn't foam.","Strain into a small bowl.","Cover the bowl with foil and steam on low heat for 10–12 minutes until fully set.","Sprinkle with finely chopped spring onion. Cool and serve."],
 "Api kecil menghasilkan tekstur licin tanpa lubang.","Low heat gives a smooth texture without holes.");
R(RB,"🥥","Nasi Lemak Mini Bayi","Mini Baby Nasi Lemak (no sambal)",20,"nasi:1/2 cw|santan:3 sb|telur:1 bj|timun:3 hr|ikanbilis:1 sk",
 ["Rebus telur 10 minit sehingga masak keras, kupas dan lenyek separuh.","Panaskan nasi bersama santan cair 3–4 minit sehingga lembut dan wangi.","Rendam ikan bilis dalam air panas 10 minit, bilas dan hancurkan halus (untuk kurangkan garam).","Hidang nasi dengan telur lenyek, timun yang dikupas dan dicincang halus, dan sedikit ikan bilis. Tanpa sambal."],
 ["Boil the egg for 10 minutes until hard, peel and mash half of it.","Warm the rice with thin coconut milk for 3–4 minutes until soft and fragrant.","Soak the anchovies in hot water for 10 minutes, rinse and crush finely (to reduce the salt).","Serve the rice with mashed egg, peeled and finely chopped cucumber, and a little anchovy. No sambal."],
 "Hidangan istimewa hujung minggu — tanpa sambal pedas.","A weekend treat — no spicy sambal.");
R(RB,"🧀","Sandwic Keju Tomato Jari","Cheese & Tomato Sandwich Fingers",8,"roti:2 kp|keju:1 kp|tomato:2 hr|mentega:1/2 sk",
 ["Buang kulit dan biji tomato, cincang halus.","Sapu mentega nipis pada roti, letakkan keju dan tomato.","Tutup dengan sekeping roti lagi, kemudian panggang ringan di kuali.","Potong jari-jari kecil dan sejukkan sebentar."],
 ["Remove the tomato skin and seeds and chop finely.","Spread thin butter on the bread; add the cheese and tomato.","Top with the second slice and lightly toast in a pan.","Cut into small fingers and cool briefly."],
 "Pilih keju rendah garam.","Choose a low-salt cheese.");

/* ===================== MAKAN TENGAH HARI / LUNCH ===================== */
R(RL,"🐟","Nasi Lembik, Ikan Kembung & Bayam","Soft Rice with Mackerel & Spinach",25,"nasi:1/2 cw|kembung:40 g|bayam:3 hlm|bawangputih:1/2 ukm|minyak:1/2 sk",
 ["Kukus atau rebus ikan kembung 8 minit. Keluarkan semua tulang dengan teliti dan hancurkan isi.","Tumis bawang putih cincang dengan sedikit minyak.","Masukkan bayam cincang halus, masak 2 minit sehingga layu.","Gaulkan nasi lembik, isi ikan dan bayam. Semak sekali lagi supaya tiada tulang."],
 ["Steam or boil the mackerel for 8 minutes. Carefully remove all bones and flake the flesh.","Sauté the minced garlic in a little oil.","Add finely chopped spinach and cook 2 minutes until wilted.","Mix the soft rice with the fish and spinach. Check once more that there are no bones."],
 "Periksa tulang dua kali — ikan kembung banyak tulang halus.","Check for bones twice — mackerel has many fine bones.");
R(RL,"🍗","Nasi Ayam Kukus & Brokoli","Steamed Chicken, Broccoli & Rice",25,"nasi:1/2 cw|ayam:40 g|brokoli:3 kn|halia:2 hr",
 ["Letakkan ayam bersama hirisan halia di atas pinggan, kukus 12–15 minit sehingga masak.","Kukus brokoli 6–8 minit sehingga sangat lembut.","Carik ayam halus-halus dan cincang brokoli kecil.","Hidang bersama nasi lembik dan sedikit air kukusan ayam."],
 ["Place the chicken with ginger slices on a plate and steam for 12–15 minutes until cooked through.","Steam the broccoli for 6–8 minutes until very soft.","Shred the chicken finely and chop the broccoli small.","Serve with soft rice and a little of the steaming juices."],
 "","");
R(RL,"🥩","Sup Daging, Lobak & Kentang","Beef, Carrot & Potato Soup with Rice",35,"daging:30 g|lobak:1/2 bj|kentang:1/2 bj|bawangmerah:1 bj|air:300 ml|nasi:1/2 cw",
 ["Didihkan air bersama bawang merah yang dihiris.","Masukkan daging cincang dan reneh 15 minit sambil membuang buih.","Masukkan lobak dan kentang potong dadu kecil, reneh 12–15 minit sehingga sangat lembut.","Hidang dengan nasi lembik. Daging dan sayur boleh dilenyek kasar."],
 ["Bring the water to a boil with the sliced shallot.","Add the minced beef and simmer for 15 minutes, skimming off any foam.","Add small diced carrot and potato; simmer 12–15 minutes until very soft.","Serve with soft rice. Mash the beef and veg roughly if needed."],
 "Daging merah ialah sumber zat besi penting untuk bayi.","Red meat is an important iron source for babies.");
R(RL,"🐠","Bubur Ikan Siakap & Labu","Barramundi & Pumpkin Porridge",35,"beras:3 sb|siakap:40 g|labu:50 g|halia:2 hr|air:400 ml",
 ["Masak beras bersama air dan halia 20 minit sehingga menjadi bubur.","Masukkan labu yang dipotong dadu kecil, masak 8 minit.","Letakkan ikan siakap ke dalam bubur dan reneh 6–8 minit sehingga masak.","Keluarkan halia dan tulang, pecahkan ikan dan labu dengan sudu, kemudian sejukkan."],
 ["Cook the rice with water and ginger for 20 minutes until porridge-like.","Add small diced pumpkin and cook 8 minutes.","Lay the barramundi in the porridge and simmer 6–8 minutes until cooked.","Remove the ginger and any bones, break up the fish and pumpkin with a spoon, then cool."],
 "","");
R(RL,"🧈","Nasi Tauhu & Sayur Campur","Tofu & Mixed Veg Rice",20,"nasi:1/2 cw|tauhu:50 g|lobak:1 sb|jagung:1 sb|kacangpanjang:2 btg|minyak:1/2 sk",
 ["Potong tauhu lembut dadu kecil. Cincang halus lobak, jagung dan kacang panjang.","Tumis sayur dengan sedikit minyak 3–4 minit; tambah 3 sudu besar air.","Masukkan tauhu, masak 3 minit dengan api kecil.","Gaul bersama nasi lembik dan hidang."],
 ["Dice the soft tofu small. Finely chop the carrot, corn and long beans.","Stir-fry the veg in a little oil for 3–4 minutes; add 3 tbsp water.","Add the tofu and cook 3 minutes on low heat.","Mix with soft rice and serve."],
 "","");
R(RL,"🥣","Dhal Lembut & Nasi","Mild Dhal with Rice",30,"dhal:3 sb|tomato:1/2 bj|bawangmerah:1 bj|kunyit:cub|nasi:1/2 cw|air:250 ml",
 ["Bilas dhal dan masukkan ke dalam periuk bersama air, bawang dan kunyit.","Reneh 15–20 minit sehingga dhal hancur.","Masukkan tomato yang dibuang kulit dan dicincang, masak 5 minit.","Lenyek sedikit dan hidang bersama nasi lembik."],
 ["Rinse the lentils and add to a pot with the water, shallot and turmeric.","Simmer for 15–20 minutes until the lentils fall apart.","Add peeled, chopped tomato and cook 5 minutes.","Mash lightly and serve with soft rice."],
 "Dhal ialah sumber zat besi dan protein tumbuhan.","Lentils are a plant source of iron and protein.");
R(RL,"🍳","Telur Dadar Lobak & Bayam + Nasi","Veggie Omelette with Rice",15,"telur:1 bj|lobak:1 sb|bayam:2 hlm|nasi:1/2 cw|minyak:1/2 sk",
 ["Pukul telur, masukkan lobak parut dan bayam cincang halus.","Panaskan kuali dengan sedikit minyak atas api kecil.","Tuang adunan dan masak kedua-dua belah sehingga masak sepenuhnya.","Potong kecil-kecil dan hidang bersama nasi lembik."],
 ["Beat the egg and stir in grated carrot and finely chopped spinach.","Heat a pan with a little oil on low heat.","Pour in the mixture and cook both sides until fully set.","Cut into small pieces and serve with soft rice."],
 "","");
R(RL,"🍝","Pasta Sos Tomato & Ayam","Chicken Tomato Pasta",25,"pasta:30 g|ayam:30 g|tomato:1 bj|lobak:1 sb|bawangputih:1/2 ukm|minyak:1/2 sk",
 ["Rebus pasta kecil tanpa garam sehingga sangat lembut, toskan.","Tumis bawang putih, masukkan ayam cincang dan lobak parut, masak 5 minit.","Masukkan tomato yang dibuang kulit dan dicincang, reneh 8 minit menjadi sos. Lenyek sos.","Gaulkan pasta dengan sos dan hidang selepas sejuk sedikit."],
 ["Boil the small pasta without salt until very soft; drain.","Sauté the garlic, add minced chicken and grated carrot and cook for 5 minutes.","Add peeled, chopped tomato and simmer 8 minutes into a sauce. Mash the sauce.","Toss the pasta with the sauce and serve slightly cooled."],
 "","");
R(RL,"🧆","Bebola Ayam Kukus & Nasi","Steamed Chicken Patties with Rice",30,"ayam:50 g|lobak:1 sb|oat:1 sb|bawangputih:1/2 ukm|nasi:1/2 cw",
 ["Campurkan ayam cincang, lobak parut, oat yang dikisar halus dan bawang putih parut.","Bentuk bebola kecil dan tekan sedikit supaya leper (bukan bulat penuh).","Kukus 12–15 minit sehingga masak sepenuhnya.","Potong separuh dan hidang bersama nasi lembik."],
 ["Mix the minced chicken, grated carrot, finely ground oats and grated garlic.","Shape into small patties and press flat (not fully round balls).","Steam for 12–15 minutes until fully cooked.","Cut in half and serve with soft rice."],
 "Bentuk leper lebih selamat daripada bola bulat.","Flat shapes are safer than round balls.");
R(RL,"🥔","Bubur Hati Ayam & Keledek","Chicken Liver & Sweet Potato Porridge",35,"beras:3 sb|hati:20 g|keledek:60 g|air:400 ml",
 ["Masak beras dengan air 20 minit sehingga menjadi bubur.","Rebus hati ayam dalam air lain 8–10 minit sehingga masak sepenuhnya, kemudian cincang sangat halus.","Masukkan keledek potong dadu kecil ke dalam bubur, masak 10 minit.","Gaulkan hati ayam dan lenyek sedikit. Hidang suam."],
 ["Cook the rice with the water for 20 minutes until porridge-like.","Boil the chicken liver in separate water for 8–10 minutes until fully cooked, then chop very finely.","Add small diced sweet potato to the porridge and cook 10 minutes.","Stir in the liver and mash lightly. Serve warm."],
 "Hati sangat kaya zat besi, tetapi beri tidak lebih daripada sekali seminggu.","Liver is very rich in iron, but offer it no more than once a week.");
R(RL,"🌱","Nasi Tempe & Lobak","Tempeh & Carrot Rice",20,"tempe:40 g|lobak:1 sb|nasi:1/2 cw|bawangputih:1/2 ukm|minyak:1/2 sk",
 ["Kukus tempe 10 minit untuk melembutkan dan mengurangkan rasa pahit.","Lenyek atau cincang tempe halus.","Tumis bawang putih dan lobak parut dengan sedikit minyak 3 minit.","Gaul bersama tempe dan nasi lembik."],
 ["Steam the tempeh for 10 minutes to soften it and mellow any bitterness.","Mash or finely chop the tempeh.","Sauté the garlic and grated carrot in a little oil for 3 minutes.","Mix with the tempeh and soft rice."],
 "","");
R(RL,"🍛","Kari Kuning Ayam & Kentang (Tidak Pedas)","Mild Yellow Chicken & Potato Curry",30,"ayam:40 g|kentang:1/2 bj|santan:30 ml|kunyit:cub|halia:2 hr|bawangmerah:1 bj|nasi:1/2 cw|air:150 ml",
 ["Tumbuk atau kisar halus bawang merah dan halia. Tumis sebentar dengan sedikit air.","Masukkan kunyit, ayam yang dipotong kecil dan air, reneh 10 minit.","Masukkan kentang potong dadu kecil, masak 10 minit sehingga lembut.","Tuang santan cair, panaskan sebentar. Tanpa cili dan garam. Hidang bersama nasi lembik."],
 ["Pound or blend the shallot and ginger finely. Sauté briefly with a little water.","Add the turmeric, small pieces of chicken and the water; simmer for 10 minutes.","Add small diced potato and cook 10 minutes until soft.","Pour in the thin coconut milk and heat briefly. No chilli and no salt. Serve with soft rice."],
 "","");
R(RL,"🐟","Nasi Ikan Selar Masak Kunyit","Turmeric Scad with Rice",25,"selar:40 g|kunyit:cub|tomato:1/2 bj|nasi:1/2 cw|air:100 ml|bawangputih:1/2 ukm",
 ["Rebus ikan selar dengan air, kunyit dan bawang putih 8–10 minit.","Angkat ikan, buang kulit dan semua tulang, hancurkan isi.","Masukkan tomato cincang (tanpa kulit) ke dalam air rebusan, reneh 5 minit.","Gaul isi ikan dan sos tomato bersama nasi lembik."],
 ["Boil the scad with the water, turmeric and garlic for 8–10 minutes.","Lift out the fish, remove the skin and all bones, and flake the flesh.","Add chopped, peeled tomato to the cooking liquid and simmer 5 minutes.","Mix the fish and tomato sauce with soft rice."],
 "","");
R(RL,"🌽","Sup Ayam, Jagung & Lobak + Nasi","Chicken, Corn & Carrot Soup with Rice",30,"ayam:40 g|jagung:2 sb|lobak:1/2 bj|halia:2 hr|air:300 ml|nasi:1/2 cw",
 ["Didihkan air bersama halia dan ayam, reneh 10 minit.","Masukkan jagung dan lobak potong kecil, masak 12 minit sehingga lembut.","Carik ayam halus-halus; lenyek kasar jagung (kulit jagung sukar dihadam).","Hidang bersama nasi lembik."],
 ["Bring the water to a boil with the ginger and chicken; simmer 10 minutes.","Add small pieces of corn and carrot; cook 12 minutes until soft.","Shred the chicken finely; mash the corn roughly (corn skins are hard to digest).","Serve with soft rice."],
 "","");
R(RL,"🍗","Nasi Ayam Bayi (Tanpa Sos Pedas)","Baby Chicken Rice",35,"beras:4 sb|ayam:40 g|stok:250 ml|halia:2 hr|bawangputih:1/2 ukm|timun:3 hr",
 ["Tumis bawang putih dan halia sebentar, masukkan beras dan gaul.","Masak beras dengan stok ayam (tanpa garam) sehingga lembik.","Rebus atau kukus ayam sehingga masak, kemudian carik halus.","Hidang nasi dengan ayam dan timun yang dikupas serta dicincang halus."],
 ["Briefly sauté the garlic and ginger, add the rice and stir.","Cook the rice in unsalted chicken stock until soft.","Boil or steam the chicken until cooked, then shred finely.","Serve the rice with the chicken and peeled, finely chopped cucumber."],
 "","");

R(RD,"🐠","Bubur Ikan Selar & Bayam","Scad & Spinach Porridge",30,"beras:3 sb|selar:40 g|bayam:3 hlm|halia:2 hr|air:400 ml",
 ["Masak beras dengan air dan halia 20 minit sehingga menjadi bubur.","Rebus ikan selar dalam air lain 8 minit, buang kulit dan semua tulang, hancurkan isi.","Masukkan bayam cincang halus ke dalam bubur, masak 3 minit.","Gaulkan isi ikan, buang halia dan hidang suam."],
 ["Cook the rice with water and ginger for 20 minutes until porridge-like.","Boil the scad in separate water for 8 minutes, remove the skin and all bones, and flake the flesh.","Add finely chopped spinach to the porridge and cook 3 minutes.","Stir in the fish, remove the ginger and serve warm."],
 "Periksa tulang ikan dua kali sebelum disuap.","Check the fish for bones twice before feeding.");
R(RD,"🍲","Sup Ayam, Kentang & Lobak","Chicken, Potato & Carrot Soup",30,"ayam:40 g|kentang:1/2 bj|lobak:1/2 bj|bawangputih:1/2 ukm|air:300 ml|nasi:1/2 cw",
 ["Didihkan air bersama bawang putih dan ayam, reneh 10 minit.","Masukkan kentang dan lobak potong dadu kecil, masak 12–15 minit sehingga sangat lembut.","Carik ayam halus dan lenyek sedikit sayur.","Hidang bersama nasi lembik."],
 ["Bring the water to a boil with the garlic and chicken; simmer 10 minutes.","Add small diced potato and carrot; cook 12–15 minutes until very soft.","Shred the chicken finely and mash the veg slightly.","Serve with soft rice."],
 "","");
R(RD,"🍮","Telur Kukus Tauhu + Nasi","Steamed Egg Tofu with Rice",15,"telur:1 bj|tauhu:40 g|stok:60 ml|nasi:1/2 cw",
 ["Lenyek tauhu lembut dalam mangkuk kecil.","Pukul telur dengan stok, tuang ke atas tauhu.","Kukus api kecil 10–12 minit sehingga set sepenuhnya.","Hidang bersama nasi lembik."],
 ["Mash the soft tofu in a small bowl.","Whisk the egg with the stock and pour over the tofu.","Steam on low heat for 10–12 minutes until fully set.","Serve with soft rice."],
 "","");
R(RD,"🍚","Nasi Tim Daging & Labu","Steamed Rice with Beef & Pumpkin",35,"nasi:1/2 cw|daging:30 g|labu:50 g|halia:2 hr|air:100 ml",
 ["Cincang daging halus; potong labu dadu kecil.","Letakkan nasi, daging, labu dan halia dalam mangkuk tahan panas, tambah air.","Kukus 25 minit sehingga daging masak dan labu lembut.","Keluarkan halia, gaul rata dan lenyek sedikit."],
 ["Mince the beef finely; dice the pumpkin small.","Place the rice, beef, pumpkin and ginger in a heatproof bowl and add the water.","Steam for 25 minutes until the beef is cooked and the pumpkin is soft.","Remove the ginger, mix well and mash slightly."],
 "","");
R(RD,"🍲","Sup Ikan Kembung Halia + Nasi","Ginger Mackerel Soup with Rice",25,"kembung:40 g|halia:3 hr|tomato:1/2 bj|bawangmerah:1 bj|air:250 ml|nasi:1/2 cw",
 ["Didihkan air bersama halia dan bawang merah yang dihiris.","Masukkan ikan kembung, reneh 8–10 minit sehingga masak.","Angkat ikan, buang kulit dan semua tulang halus, hancurkan isi.","Masukkan tomato tanpa kulit ke dalam sup, reneh 5 minit, kemudian hidang dengan isi ikan dan nasi lembik."],
 ["Bring the water to a boil with the ginger and sliced shallot.","Add the mackerel and simmer 8–10 minutes until cooked.","Lift out the fish, remove the skin and all fine bones, and flake the flesh.","Add peeled tomato to the soup, simmer 5 minutes, then serve with the fish and soft rice."],
 "Sup halia menghangatkan badan dan sedap untuk waktu malam.","Ginger soup is warming and lovely in the evening.");
R(RD,"🥔","Lenyek Kentang, Keju & Brokoli","Mashed Potato, Cheese & Broccoli",25,"kentang:1 bj|brokoli:4 kn|keju:1 kp|susu:2 sb|mentega:1/2 sk",

R(RD,"🥚","Telur Dadar Gulung Keledek","Sweet Potato Omelette Roll",20,"telur:1 bj|keledek:50 g|susu:1 sb|minyak:1/2 sk",

function condOf(k){return CONDS.filter(function(c){return c.k===k})[0]||CONDS[0]}
function symOf(k){return SYM.filter(function(s){return s.k===k})[0]}
function tcls(t){return t>=38?'t2':t>=37.5?'t1':'t0'}
function dayLabel(s){
  var t=todayS();
  if(s===t)return 'Hari ini';
  if(s===addD(t,-1))return 'Semalam';
  var d=pd(s);return MS_WD[d.getDay()]+', '+d.getDate()+' '+MS_MON[d.getMonth()];
}
function tempChart(){
  var from=addD(todayS(),-13);
  var pts=state.logs.filter(function(l){return l.temp>0&&l.ts.slice(0,10)>=from}).sort(function(a,b){return a.ts<b.ts?-1:1});
  if(!pts.length)return '';
  var W=340,H=150,pl=30,pr=10,pt=10,pb=22,t0=pd(from).getTime(),t1=Date.now()+3600e3;
  function X(ts){return pl+(new Date(ts).getTime()-t0)/(t1-t0)*(W-pl-pr)}
  function Y(v){v=Math.max(36,Math.min(41,v));return pt+(41-v)/5*(H-pt-pb)}
  var s='<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Carta suhu 14 hari">';
  [36,37,38,39,40,41].forEach(function(v){
    s+='<line x1="'+pl+'" x2="'+(W-pr)+'" y1="'+Y(v)+'" y2="'+Y(v)+'" stroke="currentColor" stroke-opacity=".12"/><text x="'+(pl-6)+'" y="'+(Y(v)+3.5)+'" text-anchor="end" font-size="10" fill="currentColor" opacity=".6">'+v+'</text>';
  });
  s+='<line x1="'+pl+'" x2="'+(W-pr)+'" y1="'+Y(38)+'" y2="'+Y(38)+'" stroke="#E5484D" stroke-width="1.5" stroke-dasharray="5 4"/>';
  s+='<polyline fill="none" stroke="#9D8CFF" stroke-width="2.5" stroke-linejoin="round" points="'+pts.map(function(p){return X(p.ts).toFixed(1)+','+Y(p.temp).toFixed(1)}).join(' ')+'"/>';
  pts.forEach(function(p){s+='<circle cx="'+X(p.ts).toFixed(1)+'" cy="'+Y(p.temp).toFixed(1)+'" r="4.5" fill="'+(p.temp>=38?'#E5484D':p.temp>=37.5?'#F59E0B':'#17A57B')+'" stroke="#fff" stroke-width="1.5"/>'});
  s+='<text x="'+pl+'" y="'+(H-5)+'" font-size="10" fill="currentColor" opacity=".6">'+pd(from).getDate()+' '+MS_MON[pd(from).getMonth()]+'</text><text x="'+(W-pr)+'" y="'+(H-5)+'" text-anchor="end" font-size="10" fill="currentColor" opacity=".6">Hari ini</text></svg>';
  return s;
}

/* ---------- SUMMARY ---------- */
function ageStr(L){
  if(!state.baby.dob)return '-';
  var b=pd(state.baby.dob), n=new Date(), m=(n.getFullYear()-b.getFullYear())*12+n.getMonth()-b.getMonth();
  if(n.getDate()<b.getDate())m--; if(m<0)m=0;
  var y=Math.floor(m/12), mm=m%12;
  return L==='en'?((y?y+' yr ':'')+mm+' mo'):((y?y+' tahun ':'')+mm+' bulan');
}
function genSummary(){
  var L=sumLang, M=L==='en'?EN_MON:MS_MON;
  function tr(a,b){return L==='en'?b:a}
  var end=todayS(), days=sumRange==='visit'?14:+sumRange;
  var start=(sumRange==='visit'&&state.lastVisit)?state.lastVisit:addD(end,-(days-1));
  function dm(s){var a=s.split('-');return (+a[2])+' '+M[+a[1]-1]}
  function dt(ts){return dm(ts.slice(0,10))+', '+ts.slice(11,16)}
  var logs=state.logs.filter(function(x){var d=x.ts.slice(0,10);return d>=start&&d<=end}).sort(function(a,b){return a.ts<b.ts?-1:1});
  var o=[];
  o.push(tr('RINGKASAN KESIHATAN ANAK','CHILD HEALTH SUMMARY'));
  o.push(tr('Nama','Name')+': '+(state.baby.name||'-'));
  o.push(tr('Umur','Age')+': '+ageStr(L)+(state.baby.dob?' ('+tr('lahir','born')+' '+fmtLong(state.baby.dob,L)+')':''));
  o.push(tr('Alahan','Allergies')+': '+(state.baby.allergy||tr('Tiada dicatat','None recorded')));
  o.push(tr('Tempoh','Period')+': '+dm(start)+' – '+dm(end)+' '+end.slice(0,4));
  o.push('');
  o.push('— '+tr('RINGKASAN','OVERVIEW')+' —');
  if(!logs.length)o.push(tr('Tiada rekod kesihatan dalam tempoh ini.','No health records in this period.'));
  else{
    var sickD={},mehD={};
    logs.forEach(function(l){var d=l.ts.slice(0,10);if(l.cond==='sick')sickD[d]=1;else if(l.cond==='meh')mehD[d]=1});
    o.push(tr('Hari sakit','Days sick')+': '+Object.keys(sickD).length+' | '+tr('Hari kurang sihat','Days unwell')+': '+Object.keys(mehD).length);
    var temps=logs.filter(function(l){return l.temp>0});
    if(temps.length){
      var mx=temps.reduce(function(a,b){return b.temp>a.temp?b:a});
      o.push(tr('Suhu tertinggi','Highest temperature')+': '+mx.temp.toFixed(1)+'°C ('+dt(mx.ts)+')');
      o.push(tr('Bacaan 38°C ke atas','Readings 38°C or above')+': '+temps.filter(function(l){return l.temp>=38}).length+' / '+temps.length);
    }else o.push(tr('Suhu: tiada bacaan direkod','Temperature: no readings recorded'));
    var cnt={};logs.forEach(function(l){(l.sym||[]).forEach(function(k){cnt[k]=(cnt[k]||0)+1})});
    var ks=Object.keys(cnt).sort(function(a,b){return cnt[b]-cnt[a]});
    if(ks.length)o.push(tr('Simptom','Symptoms')+': '+ks.map(function(k){var s=symOf(k);return (s?(L==='en'?s.en:s.ms):k)+' ('+cnt[k]+'x)'}).join(', '));
    if(cnt.nafas||cnt.kejang)o.push('⚠ '+tr('Ada rekod sukar bernafas / kejang — maklumkan segera kepada jururawat.','Difficulty breathing / seizure was recorded — tell the nurse straight away.'));
    var meds={};logs.forEach(function(l){if(l.medName){var k=l.medName+(l.medDose?' '+l.medDose:'');meds[k]=(meds[k]||0)+1}});
    var mk=Object.keys(meds);
    if(mk.length)o.push(tr('Ubat diberi','Medicine given')+': '+mk.map(function(k){return k+' ('+meds[k]+'x)'}).join('; '));
    else o.push(tr('Ubat diberi: tiada direkod','Medicine given: none recorded'));
  }
  var eat={habis:0,separuh:0,sikit:0,tak:0},tot=0;
  Object.keys(state.eat).forEach(function(d){if(d>=start&&d<=end){['b','l','d'].forEach(function(m){var v=state.eat[d][m];if(v&&eat[v]!=null){eat[v]++;tot++}})}});
  if(tot)o.push(tr('Selera makan ('+tot+' hidangan direkod)','Appetite ('+tot+' meals recorded)')+': '+tr('habis ','finished ')+eat.habis+', '+tr('separuh ','half ')+eat.separuh+', '+tr('sikit ','a little ')+eat.sikit+', '+tr('tak nak ','refused ')+eat.tak);
  var gr=state.growth.slice().sort(function(a,b){return a.date<b.date?1:-1})[0];
  if(gr)o.push(tr('Pertumbuhan terkini','Latest growth')+' ('+dm(gr.date)+'): '+(gr.kg?gr.kg+' kg':'')+(gr.cm?', '+gr.cm+' cm':'')+(gr.hc?', '+tr('kepala ','head ')+gr.hc+' cm':''));
  if(state.lastVisit)o.push(tr('Lawatan KK terakhir','Last clinic visit')+': '+fmtLong(state.lastVisit,L));
  if(logs.length){
    o.push('');o.push('— '+tr('KRONOLOGI','TIMELINE')+' —');
    logs.forEach(function(l){
      var c=condOf(l.cond), p=[];
      p.push(L==='en'?c.en:c.ms);
      if(l.temp)p.push(l.temp.toFixed(1)+'°C');
      if(l.sym&&l.sym.length)p.push(l.sym.map(function(k){var s=symOf(k);return s?(L==='en'?s.en:s.ms):k}).join(', '));
      if(l.medName)p.push(tr('Ubat: ','Medicine: ')+l.medName+(l.medDose?' '+l.medDose:''));
      if(l.note)p.push(tr('Nota: ','Note: ')+l.note);
      o.push(dt(l.ts)+' – '+p.join(' | '));
    });
  }
  return o.join('\n');
}
function summarySheet(keep){
  if(sumRange==='visit'&&!state.lastVisit)sumRange='14';
  var h='<h2>Ringkasan untuk jururawat</h2><p class="help noprint">Tunjukkan skrin ini, salin dan hantar melalui WhatsApp, atau cetak / simpan sebagai PDF.</p>'+
   '<div class="seg noprint">'+[['7','7 hari'],['14','14 hari'],['30','30 hari'],['visit','Sejak KK']].map(function(r){return '<button data-act="sumr" data-v="'+r[0]+'" aria-pressed="'+(sumRange===r[0])+'"'+(r[0]==='visit'&&!state.lastVisit?' disabled style="opacity:.4"':'')+'>'+r[1]+'</button>'}).join('')+'</div>'+
   '<div class="seg noprint"><button data-act="suml" data-v="ms" aria-pressed="'+(sumLang==='ms')+'">Bahasa Melayu</button><button data-act="suml" data-v="en" aria-pressed="'+(sumLang==='en')+'">English</button></div>'+
   '<div class="sumout" id="sumOut">'+esc(genSummary())+'</div>'+
   (!state.lastVisit?'<p class="help noprint">Tip: isi tarikh lawatan KK terakhir di Tetapan ⚙️ untuk pilihan "Sejak KK".</p>':'')+
   '<div class="row2 noprint"><button class="btn gold" data-act="copySum">📋 Salin</button><button class="btn" data-act="printSum">🖨️ Cetak / PDF</button></div>'+
   '<div class="row2 noprint"><button class="btn ghost" data-act="close">Tutup</button></div>';
  openSheet(h,keep);
}

/* ---------- GUIDE ---------- */
function renderGuide(){
  var h=topbar('Panduan Ibu','Untuk bayi 12 bulan · For a 1-year-old');
  h+='<div class="card guide"><h3>🕐 Rutin sehari · Daily rhythm</h3><ul>'+
   '<li>3 hidangan utama + 1–2 snek kecil (buah, yogurt, roti jari)<small>3 main meals + 1–2 small snacks (fruit, yogurt, toast fingers)</small></li>'+
   '<li>Susu: kira-kira 350–500 ml sehari (susu ibu atau susu penuh krim). Jangan terlalu banyak supaya selera makan tidak berkurang.<small>Milk: roughly 350–500 ml a day (breast milk or full-cream milk). Not too much, so appetite for food stays good.</small></li>'+
   '<li>Tawarkan air masak dalam cawan bersama makanan.<small>Offer boiled water in a cup with meals.</small></li></ul></div>';
  h+='<div class="card guide"><h3>🥄 Tekstur & saiz · Texture & portion</h3><ul>'+
   '<li>Lembut, lenyek kasar atau potong kecil. Makanan jari yang lembut digalakkan.<small>Soft, roughly mashed or cut small. Soft finger foods are great.</small></li>'+
   '<li>Mulakan dengan 3–6 sudu besar setiap hidangan, ikut selera si kecil. Jangan paksa.<small>Start with 3–6 tablespoons per meal and follow their appetite. Never force.</small></li>'+
   '<li>Beri makanan kaya zat besi setiap hari: daging, ayam, hati (sekali seminggu), telur, dhal, tempe.<small>Offer iron-rich foods daily: meat, chicken, liver (once a week), egg, lentils, tempeh.</small></li></ul></div>';
  h+='<div class="card guide"><h3>🚫 Elakkan · Avoid</h3><ul>'+
   '<li>Garam, gula, kicap masin, MSG, makanan segera dan mi segera.<small>Salt, sugar, salty soy sauce, MSG, fast food and instant noodles.</small></li>'+
   '<li>Risiko tercekik: kacang bulat, anggur bulat (belah memanjang), popcorn, sosej bulat, epal atau lobak mentah yang keras, tulang ikan/ayam.<small>Choking hazards: whole nuts, whole grapes (cut lengthwise), popcorn, round sausage slices, hard raw apple or carrot, fish/chicken bones.</small></li>'+
   '<li>Telur separuh masak, minuman manis, teh, kopi, air berkarbonat.<small>Runny eggs, sweet drinks, tea, coffee, fizzy drinks.</small></li>'+
   '<li>Ikan besar yang tinggi merkuri seperti yu dan todak.<small>Large high-mercury fish such as shark and swordfish.</small></li>'+
   '<li>Ikan bilis: rendam dan bilas dahulu kerana masin.<small>Anchovies: soak and rinse first because they are salty.</small></li></ul></div>';
  h+='<div class="card guide"><h3>🤧 Alahan makanan · Food allergies</h3><ul>'+
   '<li>Kenalkan satu makanan baru pada satu masa dan tunggu 2–3 hari. Alergen biasa: telur, susu, ikan, soya, gandum, kacang, udang.<small>Introduce one new food at a time and wait 2–3 days. Common allergens: egg, milk, fish, soy, wheat, nuts, shellfish.</small></li>'+
   '<li>Tanda: ruam, gatal, muntah, cirit-birit. Catat dalam rekod kesihatan dan tunjukkan kepada jururawat.<small>Signs: rash, itching, vomiting, diarrhoea. Log it and show the nurse.</small></li>'+
   '<li>Bengkak bibir/muka atau sukar bernafas selepas makan = kecemasan, hubungi 999.<small>Swollen lips/face or trouble breathing after eating = emergency, call 999.</small></li></ul></div>';
  h+='<div class="card guide"><h3>🏥 Bila perlu jumpa doktor / KK · When to see a doctor</h3><ul>'+
   '<li>Demam 38°C ke atas lebih 2–3 hari, atau demam 39°C ke atas.<small>Fever 38°C or more for over 2–3 days, or 39°C or more.</small></li>'+
   '<li>Kurang minum, lampin kurang basah, muntah atau cirit-birit berterusan.<small>Drinking less, fewer wet nappies, ongoing vomiting or diarrhoea.</small></li>'+
   '<li>Ruam baru, sakit telinga, batuk lebih 2 minggu, atau tidak mahu makan sepanjang hari.<small>New rash, ear pain, cough over 2 weeks, or refusing food all day.</small></li>'+
   '<li>Anda rasa ada yang tidak kena — percayai gerak hati ibu.<small>You feel something is wrong — trust your instinct.</small></li></ul></div>';
  h+='<div class="card guide red"><h3>🚨 Kecemasan — hubungi 999 · Emergency</h3><ul>'+
   '<li>Sukar bernafas, nafas sangat laju, bibir kebiruan.<small>Trouble breathing, very fast breathing, bluish lips.</small></li>'+
   '<li>Kejang, sangat lemah, sukar dikejutkan atau tidak bertindak balas.<small>Seizure, very floppy, hard to wake or unresponsive.</small></li>'+
   '<li>Ruam ungu/merah yang tidak pudar bila ditekan.<small>Purple/red rash that does not fade when pressed.</small></li>'+
   '<li>Muntah hijau atau berdarah, najis berdarah, tiada lampin basah lebih 8 jam.<small>Green or bloody vomit, bloody stool, no wet nappy for over 8 hours.</small></li></ul></div>';
  h+='<div class="card guide"><h3>📝 Apa nak catat untuk jururawat · What to note</h3><ul>'+
   '<li>Bila mula, suhu dan waktu diambil, ubat + dos + waktu, berapa banyak minum/makan, lampin basah, tidur dan ruam.<small>When it started, temperature and time, medicine + dose + time, how much eaten/drunk, wet nappies, sleep and rash.</small></li></ul></div>';
  h+='<p class="muted" style="font-size:12.5px;text-align:center;margin:10px 8px">Panduan umum sahaja dan bukan pengganti nasihat doktor atau jururawat. Semak dengan KK untuk keperluan si kecil, terutama jika ada alahan atau masalah kesihatan.<br>General guidance only, not a substitute for advice from your doctor or nurse.</p>';
  return h;
}

/* ---------- sheets ---------- */
function openSheet(html,keep){
  var s=$('sheetIn'),top=s.scrollTop;
  s.innerHTML='<div class="grab"></div>'+html;
  $('scrim').classList.add('on');$('sheet').classList.add('on');
  s.scrollTop=keep?top:0;
}
function closeSheet(){$('scrim').classList.remove('on');$('sheet').classList.remove('on');editId=null}
function settingsSheet(first){
  var b=state.baby;
  openSheet('<h2>'+(first===true?'Selamat datang! 👋':'Tetapan')+'</h2><p class="help">'+(first===true?'Beritahu kami sedikit tentang si kecil. Semua data disimpan dalam telefon anda sahaja.':'Maklumat si kecil dan sandaran data.')+'</p>'+
   '<label class="f" for="sName">Nama si kecil</label><input class="inp" id="sName" maxlength="24" placeholder="cth Adam" value="'+esc(b.name)+'">'+
   '<label class="f" for="sDob">Tarikh lahir</label><input class="inp" id="sDob" type="date" value="'+esc(b.dob)+'">'+
   '<label class="f" for="sAlg">Alahan (jika ada)</label><input class="inp" id="sAlg" placeholder="cth telur, susu lembu" value="'+esc(b.allergy)+'">'+
   '<label class="f" for="sStart">Menu Hari 1 bermula pada</label><input class="inp" id="sStart" type="date" value="'+esc(state.start)+'">'+
   '<label class="f" for="sVisit">Lawatan KK terakhir</label><input class="inp" id="sVisit" type="date" value="'+esc(state.lastVisit)+'">'+
   '<label class="f" for="sNext">Janji temu KK seterusnya</label><input class="inp" id="sNext" type="date" value="'+esc(state.next.date)+'">'+
   '<input class="inp" id="sNextNote" style="margin-top:8px" placeholder="Nota janji temu (cth imunisasi 15 bulan)" value="'+esc(state.next.note)+'">'+
   '<div class="row2"><button class="btn ghost" data-act="close">Batal</button><button class="btn gold" data-act="saveSettings">Simpan</button></div>'+
   (first===true?'':'<h3 class="sh">Sandaran data</h3><p class="help">Salin teks ini dan simpan dalam Nota. Tampal semula untuk pulihkan.</p><textarea class="inp" id="bk" spellcheck="false" style="font-family:ui-monospace,monospace;font-size:12px"></textarea>'+
   '<div class="row2"><button class="btn ghost" data-act="copyBk">Salin sandaran</button><button class="btn" data-act="restoreBk">Pulihkan</button></div>'+
   '<div class="row2"><button class="btn danger" data-act="reset">Padam semua data</button></div>'));
  if($('bk'))$('bk').value=JSON.stringify(state);
}
function copyText(txt,ok){
  function fb(){var ta=document.createElement('textarea');ta.value=txt;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();try{document.execCommand('copy');toast(ok)}catch(e){toast('Tekan lama pada teks untuk salin')}document.body.removeChild(ta)}
  if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(txt).then(function(){toast(ok)},fb);else fb();
}

/* ---------- actions ---------- */
var acts={
  tab:function(el){tab=el.dataset.v;animNext=true;render();window.scrollTo(0,0)},
  day:function(el){selDay=+el.dataset.n;render()},
  today:function(){selDay=curDayInfo().n;centerDay=true;animNext=true;render()},
  recipe:function(el){recipeSheet(el.dataset.m)},
  rlang:function(el){state.rlang=el.dataset.v;save();recipeSheet(openM,true)},
  eat:function(el){
    var date=dateOfDay(selDay);state.eat[date]=state.eat[date]||{};
    state.eat[date][openM]=(state.eat[date][openM]===el.dataset.v)?'':el.dataset.v;
    if(!state.eat[date][openM])delete state.eat[date][openM];
    save();render();recipeSheet(openM,true);
  },
  week:function(el){shopWeek=+el.dataset.w;render()},
  buy:function(el){var w=state.shop[shopWeek]=state.shop[shopWeek]||{};if(w[el.dataset.k])delete w[el.dataset.k];else w[el.dataset.k]=1;save();render()},
  resetShop:function(){state.shop[shopWeek]={};save();render();toast('Senarai dikosongkan')},
  close:closeSheet,
  settings:function(){settingsSheet()},
  saveSettings:function(){
    state.baby.name=$('sName').value.trim();state.baby.dob=$('sDob').value;state.baby.allergy=$('sAlg').value.trim();
    state.start=$('sStart').value||state.start||todayS();state.lastVisit=$('sVisit').value;
    state.next.date=$('sNext').value;state.next.note=$('sNextNote').value.trim();
    selDay=curDayInfo().n;centerDay=true;save();closeSheet();render();toast('Disimpan ✓');
  },
  newLog:function(){logSheet()},
  editLog:function(el){logSheet(el.dataset.id)},
  quick:function(el){
    var v=el.dataset.v;
    if(v==='ok'){state.logs.push({id:uid(),ts:nowLocal(),cond:'ok',sym:[],temp:0,medName:'',medDose:'',note:''});save();render();toast('Direkod: Sihat 😊')}
    else{logSheet();curCond=v;document.querySelectorAll('#sheetIn .cond').forEach(function(b){b.setAttribute('aria-pressed',b.dataset.v===v)})}
  },
  cond:function(el){curCond=el.dataset.v;document.querySelectorAll('#sheetIn .cond').forEach(function(b){b.setAttribute('aria-pressed',b.dataset.v===curCond)})},
  sym:function(el){
    var k=el.dataset.k,i=curSym.indexOf(k);
    if(i>-1)curSym.splice(i,1);else curSym.push(k);
    el.setAttribute('aria-pressed',i<0);
    if(k==='demam'&&i<0&&curCond==='ok'){curCond='sick';document.querySelectorAll('#sheetIn .cond').forEach(function(b){b.setAttribute('aria-pressed',b.dataset.v==='sick')})}
    warnCheck();
  },
  medq:function(el){$('lMed').value=el.dataset.v;$('lDose').focus()},
  saveLog:function(){
    var ts=$('lTs').value||nowLocal(), t=num($('lTemp').value);
    if(t&&(t<34||t>43)){toast('Suhu tidak sah (34–43°C)');return}
    var rec={id:editId||uid(),ts:ts,cond:curCond,sym:curSym.slice(),temp:t,medName:$('lMed').value.trim(),medDose:$('lDose').value.trim(),note:$('lNote').value.trim()};
    if(editId){state.logs=state.logs.map(function(x){return x.id===editId?rec:x})}else state.logs.push(rec);
    save();closeSheet();render();toast('Rekod disimpan ✓');
  },
  delLog:function(el){
    if(el.dataset.sure!=='1'){el.dataset.sure='1';el.textContent='Tekan sekali lagi untuk padam';return}
    state.logs=state.logs.filter(function(x){return x.id!==el.dataset.id});save();closeSheet();render();toast('Rekod dipadam');
  },
  growth:growthSheet,
  saveGrowth:function(){
    var kg=num($('gKg').value),cm=num($('gCm').value),hc=num($('gHc').value);
    if(!kg&&!cm&&!hc){toast('Isi sekurang-kurangnya satu ukuran');return}
    state.growth.push({id:uid(),date:$('gDate').value||todayS(),kg:kg,cm:cm,hc:hc});save();growthSheet();render();toast('Disimpan ✓');
  },
  delGrowth:function(el){
    if(el.dataset.sure!=='1'){el.dataset.sure='1';el.querySelector('.sx').textContent='tekan lagi';return}
    state.growth=state.growth.filter(function(x){return x.id!==el.dataset.id});save();growthSheet();render();
  },
  summary:function(){summarySheet()},
  sumr:function(el){sumRange=el.dataset.v;summarySheet(true)},
  suml:function(el){sumLang=el.dataset.v;summarySheet(true)},
  copySum:function(){copyText($('sumOut').textContent,'Ringkasan disalin ✓')},
  printSum:function(){window.print()},
  copyBk:function(){var ta=$('bk');ta.select();copyText(ta.value,'Sandaran disalin ✓')},
  restoreBk:function(){
    try{var d=JSON.parse($('bk').value);if(!d||!d.baby||!Array.isArray(d.logs))throw 0;state=Object.assign({baby:{},next:{},eat:{},shop:{},logs:[],growth:[],start:todayS(),lastVisit:'',rlang:'both'},d);save();load();closeSheet();render();toast('Data dipulihkan ✓')}
    catch(e){toast('Teks sandaran tidak sah')}
  },
  reset:function(el){
    if(el.dataset.sure!=='1'){el.dataset.sure='1';el.textContent='Tekan sekali lagi untuk padam semua';return}
    try{localStorage.removeItem(KEY)}catch(e){}
    state={baby:{name:'',dob:'',allergy:''},start:todayS(),lastVisit:'',next:{date:'',note:''},rlang:'both',eat:{},shop:{},logs:[],growth:[]};save();closeSheet();selDay=1;render();toast('Semua data dipadam');
  }
};
document.addEventListener('click',function(e){var el=e.target.closest('[data-act]');if(!el)return;var f=acts[el.dataset.act];if(f)f(el)});
document.addEventListener('keydown',function(e){if(e.key==='Escape')closeSheet()});

load();
selDay=curDayInfo().n;
render();
if(!state.baby.name)setTimeout(function(){settingsSheet(true)},350);
})();

</script>
</body>
</html>
